name: Build Juno Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/threadly-android-app
    paths:
      - "threadly-android/**"
      - "threadly-v2/public/favicon.svg"
      - "threadly-v2/public/manifest.webmanifest"
      - ".github/workflows/build-threadly-android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: threadly-android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install JavaScript dependencies
        run: npm install

      - name: Create local web placeholder and Juno assets
        run: |
          mkdir -p www assets
          printf '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>Opening Juno…</body></html>' > www/index.html
          convert ../threadly-v2/public/favicon.svg -background none -resize 1024x1024 -gravity center -extent 1024x1024 assets/icon.png
          convert -size 2732x2732 xc:'#fff5f9' assets/splash.png
          convert -size 2732x2732 xc:'#171321' assets/splash-dark.png

      - name: Generate Android project
        run: npx cap add android

      - name: Apply Juno launcher icon and splash screen
        run: npx --yes @capacitor/assets generate --android

      - name: Build debug APK
        working-directory: threadly-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK for phone testing
        uses: actions/upload-artifact@v4
        with:
          name: juno-debug-apk
          path: threadly-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
