name: Build Threadly Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/threadly-android-app
    paths:
      - "threadly-android/**"
      - ".github/workflows/build-threadly-android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: threadly-android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: threadly-android/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Create local web placeholder
        run: |
          mkdir -p www
          printf '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>Opening Threadly…</body></html>' > www/index.html

      - name: Generate Android project
        run: npx cap add android

      - name: Build debug APK
        working-directory: threadly-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK for phone testing
        uses: actions/upload-artifact@v4
        with:
          name: threadly-debug-apk
          path: threadly-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
