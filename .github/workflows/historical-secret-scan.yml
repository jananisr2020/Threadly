name: Historical secret scan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-secret-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@latest
      - name: Scan current files and full Git history
        id: scan
        continue-on-error: true
        run: |
          "$(go env GOPATH)/bin/gitleaks" git . \
            --redact \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks-report.json" \
            --exit-code 1
      - name: Report finding metadata only
        if: always()
        env:
          REPORT_PATH: ${{ runner.temp }}/gitleaks-report.json
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          p = pathlib.Path(os.environ['REPORT_PATH'])
          findings = json.loads(p.read_text()) if p.exists() and p.stat().st_size else []
          # Never print secret values or matched text.
          for f in findings:
              print('FINDING metadata: rule=%s file=%s commit=%s line=%s' % (
                  f.get('RuleID', 'unknown'), f.get('File', 'unknown'),
                  f.get('Commit', 'unknown'), f.get('StartLine', 'unknown')))
          print('Total findings:', len(findings))
          if findings:
              sys.exit(1)
          if os.environ.get('SCAN_OUTCOME') == 'failure':
              print('Scanner failed without a report; inspect setup/tool failure, not secret values.')
              sys.exit(2)
          PY