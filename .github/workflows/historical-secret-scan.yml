name: Historical secret scan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-secret-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@latest
      - name: Scan current files and full Git history
        id: scan
        continue-on-error: true
        run: |
          "$(go env GOPATH)/bin/gitleaks" git . \
            --redact \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks-report.json" \
            --exit-code 1
      - name: Create sanitized finding summary
        if: always()
        env:
          REPORT_PATH: ${{ runner.temp }}/gitleaks-report.json
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SUMMARY_PATH: ${{ runner.temp }}/gitleaks-summary.json
        run: |
          python - <<'PY'
          import json, os, pathlib
          report = pathlib.Path(os.environ['REPORT_PATH'])
          findings = json.loads(report.read_text()) if report.exists() and report.stat().st_size else []
          safe = [{
              'rule': f.get('RuleID', 'unknown'),
              'file': f.get('File', 'unknown'),
              'commit': f.get('Commit', 'unknown'),
              'line': f.get('StartLine', 'unknown'),
              'commitMessage': f.get('CommitMessage', 'unknown')
          } for f in findings]
          pathlib.Path(os.environ['SUMMARY_PATH']).write_text(json.dumps({
              'scannerOutcome': os.environ.get('SCAN_OUTCOME'),
              'findingCount': len(safe),
              'findings': safe
          }, indent=2))
          # Do not print secrets, matched text, or full finding objects.
          for f in safe:
              print('FINDING metadata: rule=%s file=%s commit=%s line=%s' % (f['rule'], f['file'], f['commit'], f['line']))
          print('Total findings:', len(safe))
          if os.environ.get('SCAN_OUTCOME') == 'failure' and not safe:
              raise SystemExit('Scanner failed without findings report; inspect tool setup.')
          PY
      - name: Upload sanitized summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-secret-scan-summary
          path: ${{ runner.temp }}/gitleaks-summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Fail if findings exist
        if: always()
        env:
          SUMMARY_PATH: ${{ runner.temp }}/gitleaks-summary.json
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          p = pathlib.Path(os.environ['SUMMARY_PATH'])
          data = json.loads(p.read_text())
          if data['findingCount']:
              print('Secret-like patterns were found; review sanitized metadata and validate each candidate privately.')
              sys.exit(1)
          if data['scannerOutcome'] == 'failure':
              sys.exit(2)
          print('No secret-like patterns detected in scanned Git history.')
          PY