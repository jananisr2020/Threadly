name: Juno web checks

on:
  push:
    paths:
      - "threadly-v2/**"
      - ".github/workflows/juno-web-ci.yml"
  pull_request:
    paths:
      - "threadly-v2/**"
      - ".github/workflows/juno-web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storefront:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: threadly-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: threadly-v2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run storefront and configuration checks
        run: npm run check
      - name: Run checkout tests
        run: npm test
      - name: Build catalogue
        run: npm run build
