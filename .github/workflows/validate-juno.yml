name: Validate Juno storefront
on:
  push:
    branches: [main]
    paths:
      - "threadly-v2/public/index.html"
      - "threadly-v2/public/catalog.json"
      - "threadly-v2/public/images/categories/**"
      - "threadly-v2/public/manifest.webmanifest"
      - "threadly-v2/public/sw.js"
      - "threadly-v2/netlify/**"
      - "netlify.toml"
      - ".github/workflows/validate-juno.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check storefront JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('threadly-v2/public/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1])
            .filter(script => script.trim());
          if (!scripts.length) throw new Error('No inline JavaScript found in storefront');
          scripts.forEach((script, index) => fs.writeFileSync('/tmp/juno-inline-' + index + '.js', script));
          console.log('Extracted ' + scripts.length + ' script block(s)');
          NODE
          for file in /tmp/juno-inline-*.js; do node --check "$file"; done
      - name: Check Juno payment and deployment invariants
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('threadly-v2/public/index.html', 'utf8');
          if (/cash\s*on\s*delivery|\bCOD\b/i.test(html)) {
            throw new Error('Cash on delivery must remain disabled in the storefront');
          }
          const manifest = JSON.parse(fs.readFileSync('threadly-v2/public/manifest.webmanifest', 'utf8'));
          if (manifest.short_name !== 'Juno') throw new Error('PWA brand must be Juno');
          if (!manifest.icons.some(icon => icon.src.startsWith('/favicon.svg') && /maskable/.test(icon.purpose || ''))) {
            throw new Error('Manifest must include the existing Juno icon as maskable');
          }
          if (!fs.existsSync('threadly-v2/public/favicon.svg')) throw new Error('Juno favicon is missing');
          const catalogue = JSON.parse(fs.readFileSync('threadly-v2/public/catalog.json', 'utf8'));
          if (!Array.isArray(catalogue.products) || catalogue.products.length < 100) {
            throw new Error('Bundled catalogue must contain at least 100 products');
          }
          if (catalogue.productCount !== catalogue.products.length) {
            throw new Error('Bundled catalogue productCount does not match products array');
          }
          console.log('Bundled catalogue contains ' + catalogue.products.length + ' products');
          const config = fs.readFileSync('netlify.toml', 'utf8');
          if (!/base\s*=\s*"threadly-v2"/.test(config) || !/publish\s*=\s*"public"/.test(config)) {
            throw new Error('Netlify must build and publish from threadly-v2');
          }
          console.log('Juno branding, online-only storefront, PWA icon and Netlify paths verified');
          NODE
      - name: Check marketplace payment and ledger safeguards
        run: |
          node <<'NODE'
          const fs = require('fs');
          const core = fs.readFileSync('threadly-v2/netlify/lib/core.js', 'utf8');
          const admin = fs.readFileSync('threadly-v2/public/admin.html', 'utf8');
          const readme = fs.readFileSync('threadly-v2/README.md', 'utf8');
          const required = [
            ['Razorpay payment fetch', /payments\.fetch\(pi\)/],
            ['captured payment status validation', /payment\.status !== 'captured'/],
            ['webhook amount validation', /Number\(confirmed\.amount\) !== Number\(o\.total\) \* 100/],
            ['seller order idempotency', /existing\.has/],
            ['seller product price cap', /priceValue <= 500/],
            ['seller ledger', /ensureSellerLedger/],
            ['configurable commission rate', /JUNO_MARKETPLACE_COMMISSION_BPS/],
            ['refund review state', /REFUND_REVIEW/],
            ['COD remains disabled', /Cash on delivery is not available/]
          ];
          for (const [label, pattern] of required) {
            if (!pattern.test(core)) throw new Error('Missing safeguard: ' + label);
          }
          if (!admin.includes('data-t="sellerledger"') || !admin.includes('function sellerledger()')) {
            throw new Error('Admin seller ledger view is missing');
          }
          if (!readme.includes('SellerLedger') || !readme.includes('JUNO_MARKETPLACE_COMMISSION_BPS')) {
            throw new Error('Seller ledger setup instructions are missing');
          }
          console.log('Marketplace payment validation, seller ledger, refund review and COD invariants verified');
          NODE
      - name: Check Netlify function syntax
        run: find threadly-v2/netlify -name '*.js' -print0 | xargs -0 -n1 node --check
