name: Juno Android build

on:
  push:
    paths:
      - "threadly-v2/android-app/**"
      - "threadly-v2/public/index.html"
      - ".github/workflows/juno-android.yml"
  pull_request:
    paths:
      - "threadly-v2/android-app/**"
      - ".github/workflows/juno-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile debug app
        run: gradle -p threadly-v2/android-app assembleDebug
