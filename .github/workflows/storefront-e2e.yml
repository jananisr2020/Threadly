name: Storefront browser tests

on:
  push:
    branches: [main]
    paths:
      - "threadly-v2/public/**"
      - "threadly-v2/scripts/test-storefront-e2e.js"
      - ".github/workflows/storefront-e2e.yml"
  pull_request:
    paths:
      - "threadly-v2/public/**"
      - "threadly-v2/scripts/test-storefront-e2e.js"
      - ".github/workflows/storefront-e2e.yml"

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: threadly-v2/package-lock.json
      - name: Install project dependencies
        working-directory: threadly-v2
        run: npm ci
      - name: Install Playwright
        working-directory: threadly-v2
        run: npm install --no-save playwright @axe-core/playwright
      - name: Install Chromium
        working-directory: threadly-v2
        run: npx playwright install --with-deps chromium
      - name: Run storefront browser smoke tests
        working-directory: threadly-v2
        run: node scripts/test-storefront-e2e.js
