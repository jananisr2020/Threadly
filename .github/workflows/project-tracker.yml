name: Refresh Juno project tracker

on:
  push:
    branches: [main]
    paths-ignore:
      - "project-tracker.csv"
      - "PROJECT_TRACKER.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-tracker-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate tracker and timeline report
        run: python3 scripts/update_project_tracker.py
        env:
          GITHUB_REPOSITORY: \${{ github.repository }}
          GITHUB_REF_NAME: \${{ github.ref_name }}
      - name: Commit refreshed tracker files
        run: |
          if git diff --quiet -- project-tracker.csv PROJECT_TRACKER.md; then
            echo "Tracker is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-tracker.csv PROJECT_TRACKER.md
          git commit -m "Refresh project tracker and timeline"
          git push
