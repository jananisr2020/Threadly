<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Juno storefront architecture</title><desc id="desc">Customers use the Juno website or Android shell. Netlify serves the storefront and API functions. The API reads and writes Google Sheets and uses Razorpay for online payments. A bundled catalogue keeps product browsing available if the live sheet API fails.</desc>
<defs><style>.h{font:700 24px system-ui,sans-serif;fill:#24152e}.t{font:600 17px system-ui,sans-serif;fill:#24152e}.s{font:14px system-ui,sans-serif;fill:#51445c}.box{fill:#fff;stroke:#d9186c;stroke-width:2}.alt{fill:#fff4fa;stroke:#d9186c;stroke-width:2}.soft{fill:#f3edff;stroke:#7b3fe4;stroke-width:2}.line{fill:none;stroke:#7b3fe4;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#d9186c;stroke-width:2.5;stroke-dasharray:7 6;stroke-linecap:round}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7b3fe4"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d9186c"/></marker></defs>
<rect width="1100" height="620" rx="22" fill="#fff9fc"/><text x="44" y="48" class="h">Juno · Storefront &amp; data flow</text>
<rect x="40" y="90" width="250" height="110" rx="16" class="box"/><text x="165" y="124" text-anchor="middle" class="t">Customer</text><text x="165" y="153" text-anchor="middle" class="s">Browser / installable PWA</text><text x="165" y="176" text-anchor="middle" class="s">Android app shell</text>
<rect x="400" y="90" width="300" height="110" rx="16" class="alt"/><text x="550" y="124" text-anchor="middle" class="t">Netlify hosting</text><text x="550" y="153" text-anchor="middle" class="s">Juno storefront HTML/CSS/JS</text><text x="550" y="176" text-anchor="middle" class="s">Product grid + cart + checkout</text>
<path d="M290 145 H400" class="line" marker-end="url(#arr)"/><text x="345" y="132" text-anchor="middle" class="s">HTTPS</text>
<rect x="400" y="280" width="300" height="100" rx="16" class="soft"/><text x="550" y="315" text-anchor="middle" class="t">Netlify Functions / API</text><text x="550" y="343" text-anchor="middle" class="s">Products · auth · orders</text><text x="550" y="363" text-anchor="middle" class="s">Razorpay verification</text>
<path d="M550 200 V280" class="line" marker-end="url(#arr)"/><text x="565" y="245" class="s">/api/*</text>
<rect x="40" y="280" width="250" height="100" rx="16" class="alt"/><text x="165" y="315" text-anchor="middle" class="t">Bundled catalogue</text><text x="165" y="343" text-anchor="middle" class="s">/catalog.json</text><text x="165" y="363" text-anchor="middle" class="s">56 workbook product rows</text>
<path d="M400 330 H290" class="dash" marker-end="url(#arr2)"/><text x="345" y="315" text-anchor="middle" class="s">Fallback</text>
<rect x="810" y="90" width="250" height="110" rx="16" class="box"/><text x="935" y="124" text-anchor="middle" class="t">Google Sheets</text><text x="935" y="153" text-anchor="middle" class="s">Products · Orders · Users</text><text x="935" y="176" text-anchor="middle" class="s">Admin-maintained database</text>
<path d="M700 310 H760 V145 H810" class="line" marker-end="url(#arr)"/><text x="770" y="240" class="s">Read / write</text>
<rect x="810" y="280" width="250" height="100" rx="16" class="soft"/><text x="935" y="315" text-anchor="middle" class="t">Razorpay</text><text x="935" y="343" text-anchor="middle" class="s">UPI / card / netbanking</text><text x="935" y="363" text-anchor="middle" class="s">COD disabled</text>
<path d="M700 350 H810" class="line" marker-end="url(#arr)"/>
<rect x="250" y="465" width="600" height="105" rx="16" fill="#fff0f6" stroke="#d9186c" stroke-width="2"/><text x="550" y="500" text-anchor="middle" class="t">Availability behaviour</text><text x="550" y="528" text-anchor="middle" class="s">Live sheet API succeeds → use live catalogue</text><text x="550" y="551" text-anchor="middle" class="s">Live sheet API fails → load saved workbook catalogue</text>
<path d="M165 380 V430 H330 V465" class="dash" marker-end="url(#arr2)"/><path d="M550 380 V465" class="line" marker-end="url(#arr)"/>
</svg>