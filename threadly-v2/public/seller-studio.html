<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Juno Seller Studio</title><style>
:root{--pink:#d9186c;--ink:#21172b;--muted:#706879;--line:#f0dce7;--bg:#fff6fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}header{background:#21172b;color:white;padding:16px max(18px,calc((100% - 1050px)/2));display:flex;justify-content:space-between}header a{color:white}.brand{font-size:24px;font-weight:850;text-decoration:none}main{max-width:1050px;margin:auto;padding:28px 16px 60px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-weight:700;font-size:13px}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;font:inherit;background:white}.btn{background:var(--pink);color:white;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:750;cursor:pointer}.muted{color:var(--muted);font-size:13px}.status{padding:11px;border-radius:9px;display:none;margin:12px 0}.status.show{display:block}.ok{background:#e4f8eb;color:#145b35}.err{background:#fff0f0;color:#9b1c1c}.hidden{display:none!important}.pill{display:inline-block;padding:3px 8px;background:#fbe6f0;border-radius:99px;font-size:12px}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:9px;font-size:13px}.tablewrap{overflow:auto}@media(max-width:620px){.grid{grid-template-columns:1fr}main{padding:18px 10px}.card{padding:16px}}
</style></head><body><header><a class="brand" href="/">juno</a><a href="/">Shop Juno →</a></header><main>
<section id="auth" class="card"><h1>Juno Seller Studio</h1><p class="muted">For approved accessories sellers. <a href="/sell-on-juno.html">Apply to sell</a>.</p><div id="notice" class="status"></div><div id="activate" class="hidden"><h2>Activate your seller account</h2><form id="activateForm"><div class="field"><label>Password (minimum 8 characters)</label><input name="password" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label>Confirm password</label><input name="confirm" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn">Activate account</button></form></div><div id="login"><h2>Seller login</h2><form id="loginForm"><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn">Sign in</button></form></div></section>
<section id="studio" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h1 id="storeName">Your store</h1><p class="muted">New products remain hidden until Juno approves them.</p></div><button id="logout" class="btn" style="background:#4b4057">Log out</button></div></div>
<div class="card"><h2>Add a product</h2><div id="productStatus" class="status"></div><form id="productForm"><div class="grid"><div class="field"><label>Product name *</label><input name="name" required maxlength="120"></div><div class="field"><label>Category *</label><select name="cat" required><option value="">Choose</option><option>Hair accessories</option><option>Jewellery</option><option>Bags and purses</option><option>Scarves and fashion accessories</option><option>Belts and wallets</option><option>Mixed accessories</option></select></div><div class="field"><label>Price (₹) *</label><input name="price" type="number" min="1" max="50000" required></div><div class="field"><label>MRP (₹)</label><input name="mrp" type="number" min="1" max="100000"></div><div class="field"><label>Stock quantity *</label><input name="stock" type="number" min="0" max="100000" required value="1"></div><div class="field"><label>Image URL *</label><input name="image" type="url" required maxlength="500" placeholder="https://..."></div><div class="field"><label>Colours / variants</label><input name="sizes" maxlength="200"></div><div class="field"><label>Product details *</label><input name="details" required maxlength="500"></div></div><button class="btn">Submit product for review</button></form></div>
<div class="card"><h2>Your products</h2><div class="tablewrap"><table><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Review status</th><th>Visibility</th></tr></thead><tbody id="products"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></div></section>
</main><script>
const $=s=>document.querySelector(s),params=new URLSearchParams(location.search),activationToken=params.get('activate'),notice=$('#notice');let token=sessionStorage.getItem('junoSellerToken')||'';
function msg(el,text,kind){el.textContent=text;el.className='status show '+kind}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function call(url,data,t=token){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{})},body:JSON.stringify(data||{})});const d=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function showStudio(d){token=d.token||token;sessionStorage.setItem('junoSellerToken',token);$('#auth').classList.add('hidden');$('#studio').classList.remove('hidden');$('#storeName').textContent=d.seller.storeName;loadProducts()}
async function loadProducts(){try{const d=await call('/api/seller-products',{action:'load'});$('#products').innerHTML=d.products.map(p=>'<tr><td>'+esc(p.name)+'<br><small>'+esc(p.id)+'</small></td><td>₹'+p.price+'</td><td>'+p.stock+'</td><td><span class="pill">'+esc(p.status)+'</span></td><td>'+esc(p.visibility)+'</td></tr>').join('')||'<tr><td colspan="5">No products yet.</td></tr>'}catch(e){msg($('#productStatus'),e.message,'err')}}
if(activationToken){$('#login').classList.add('hidden');$('#activate').classList.remove('hidden')}
$('#activateForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);if(f.get('password')!==f.get('confirm'))return msg(notice,'Passwords do not match.','err');try{const d=await call('/api/seller-activate',{token:activationToken,password:f.get('password')},'');history.replaceState({},'','/seller-studio.html');showStudio(d)}catch(x){msg(notice,x.message,'err')}});
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{showStudio(await call('/api/seller-login',f,''))}catch(x){msg(notice,x.message,'err')}});
$('#productForm').addEventListener('submit',async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{const d=await call('/api/seller-products',{action:'save',product:f});e.target.reset();msg($('#productStatus'),'Product submitted for review. Reference: '+d.id,'ok');await loadProducts()}catch(x){msg($('#productStatus'),x.message,'err')}});
$('#logout').onclick=()=>{sessionStorage.removeItem('junoSellerToken');location.reload()};
if(token){call('/api/seller-products',{action:'profile'}).then(showStudio).catch(()=>{sessionStorage.removeItem('junoSellerToken');token=''})}
</script></body></html>
