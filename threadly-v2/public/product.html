<script>
'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');
const params=new URLSearchParams(location.search),id=params.get('p')||params.get('id')||'';
const stored=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(_){return null}},save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}};
let product=null, selected='', quantity=1, reviewsData={count:0,avg:0,list:[]}, reviewRating=0, photos=[], catalogueProducts=[], catalogueSignals={bestsellers:[],trending:[]};
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2400)}
function productUrls(p){return [...new Set([...(Array.isArray(p.images)?p.images:[]),p.img,p.fallbackImg].filter(x=>typeof x==='string'&&x.trim()).map(x=>x.trim()))].slice(0,6)}
function normalizeProduct(p){if(!p||!p.id||!p.name)return null;const price=Number(p.price??p.sellingPrice??p.selling_price)||0,mrp=Number(p.mrp)||price;return {...p,id:String(p.id),name:String(p.name),price,mrp,stock:p.stock!=null&&p.stock!==''&&Number.isFinite(Number(p.stock))?Number(p.stock):null,sizes:Array.isArray(p.sizes)?p.sizes.map(String).filter(Boolean):[],images:productUrls(p),listing:p.listing&&typeof p.listing==='object'?p.listing:null}}
function stockMarkup(p){if(p.stock===null)return '<div class="stock unknown">Availability will be confirmed at checkout.</div>';if(p.stock<=0)return '<div class="stock out" role="status">● Out of stock</div>';if(p.stock<=5)return '<div class="stock low" role="status">● In stock · Limited availability</div>';return '<div class="stock ok" role="status">● In stock</div>'}
function optionMarkup(p){if(!p.sizes.length)return '<p class="subtle">No size or colour options were provided for this listing.</p>';const label=p.sz?'Select size':'Select colour / option';return '<h2>'+label+'</h2><div class="options" id="options">'+p.sizes.map((s,i)=>'<button class="option'+(selected===s?' on':'')+'" type="button" data-option="'+esc(s)+'" aria-pressed="'+(selected===s)+'">'+esc(s)+'</button>').join('')+'</div>'+(p.sz?'<p class="subtle">Choose the option that matches your needs. Product-specific measurements are shown below when supplied.</p>':'')}
function highlights(p){const l=p.listing||{},spec=l.specifications&&typeof l.specifications==='object'?Object.entries(l.specifications):[],attrs=[['Category',p.cat||p.category],['Colour',p.color||p.colour],['Material',p.material],['Style',p.style],['Occasion',p.occasion],['Product type',p.type||p.productType],...spec].filter(x=>String(x[1]??'').trim());const seen=new Set();return attrs.filter(([k])=>{const key=String(k).toLowerCase();if(seen.has(key))return false;seen.add(key);return true}).slice(0,16)}
function renderProduct(p){product=p;selected=p.sizes.length===1?p.sizes[0]:'';photos=productUrls(p);const title=p.listing?.listingTitle||p.listingTitle||p.name,off=p.mrp>p.price?Math.round((p.mrp-p.price)/p.mrp*100):0;
document.title=title+' | Juno';$('meta[name="description"]').content=String(p.listing?.description||p.description||('Shop '+title+' at Juno.')).slice(0,155);$('#crumb').textContent='Home / '+(p.cat||'Shop')+' / '+title;
$('#status').hidden=true;$('#product').hidden=false;
const image=photos.length?'<img id="main-image" src="'+esc(photos[0])+'" alt="'+esc(title)+'" fetchpriority="high">':'<div class="fallback"><strong>'+esc(title)+'</strong><p>Product photo not available yet</p><small>We will add a verified product photo when one is available.</small></div>';
$('#product').innerHTML='<div class="layout"><section><div class="gallery"><div class="thumbs" id="thumbs">'+photos.map((u,i)=>'<button type="button" class="thumb'+(!i?' on':'')+'" data-photo="'+i+'" aria-label="Show product photo '+(i+1)+'"><img src="'+esc(u)+'" alt="" loading="lazy"></button>').join('')+'</div><div class="hero">'+image+(off?'<span class="badge">'+off+'% off</span>':'')+'</div></div></section><section class="info"><div class="brand">'+esc(p.brand||'Juno collection')+'</div><h1 class="title">'+esc(title)+'</h1><button type="button" class="btn secondary" id="wishlist" style="padding:7px 11px;margin:0 0 8px" aria-pressed="false">♡ Save to wishlist</button><div id="rating-inline" class="rating"><span class="subtle">Loading customer ratings…</span></div><div class="pricebox"><div class="price-line"><span class="price">'+money(p.price)+'</span>'+(p.mrp>p.price?'<span class="mrp">'+money(p.mrp)+'</span><span class="discount">'+off+'% off</span>':'')+'</div><div class="tax">Inclusive of listed price. Delivery fee, if applicable, is shown at checkout.</div>'+stockMarkup(p)+'</div><section class="section"><h2>Delivery options</h2><div class="delivery-check"><input id="delivery-pin" inputmode="numeric" autocomplete="postal-code" maxlength="6" placeholder="Enter 6-digit pincode" aria-label="Delivery pincode" value="'+esc(stored('tl_pin')||'')+'"><button type="button" class="btn secondary" id="check-pin">Check</button></div><p class="delivery-result" id="delivery-result">Check delivery availability for your pincode. Final serviceability is confirmed at checkout.</p></section><section class="section" id="variant-section">'+optionMarkup(p)+'</section><section class="section"><h2>Quantity</h2><div class="quantity"><button type="button" id="minus" aria-label="Decrease quantity">−</button><b id="qty">1</b><button type="button" id="plus" aria-label="Increase quantity">+</button><span class="subtle">Maximum 20 per order</span></div></section><div class="actions"><button type="button" class="btn primary" id="add" '+(p.stock===0?'disabled':'')+'>Add to cart</button><button type="button" class="btn secondary" id="buy" '+(p.stock===0?'disabled':'')+'>Buy now</button></div><div class="notice">✓ Prepaid payments only · COD is not available<br>✓ Tamil Nadu delivery coverage is checked at checkout<br>✓ Returns follow Juno’s published policy</div></section></div><section class="pdp-section"><h2>Product highlights</h2><div class="highlights" id="highlights"></div><h2 style="margin-top:20px">Product details</h2><p class="description" id="description"></p><details><summary>Specifications</summary><div class="highlights" id="specs" style="margin-top:10px"></div></details></section><section class="pdp-section" id="reviews-section"><div class="reviews-head"><h2>Ratings &amp; customer reviews</h2><span class="subtle" id="review-count-inline"></span></div><div id="reviews-summary-inline"></div><p class="subtle">Only reviews actually submitted to Juno are counted here. No sample or invented ratings are included.</p><div id="reviews-list-inline"></div><div id="review-write-inline"></div></section><section class="pdp-section" id="people-also-viewed"><h2>People also viewed</h2><p class="subtle" style="margin-top:-4px">Popular and closely related picks from the Juno catalogue.</p><div class="related-grid" id="people-also-viewed-grid"></div></section><section class="pdp-section" id="related"><h2>Similar products you may like</h2><div class="related-grid" id="related-grid"></div><p class="subtle" style="margin-bottom:0"><a href="/?browse=1">Explore the full Juno catalogue →</a></p></section>';
const attrs=highlights(p);$('#highlights').innerHTML=attrs.length?attrs.slice(0,8).map(([k,v])=>'<div class="highlight"><b>'+esc(k)+'</b>'+esc(v)+'</div>').join(''):'<div class="subtle">More product attributes will be added when verified details are available.</div>';
$('#specs').innerHTML=attrs.length?attrs.map(([k,v])=>'<div class="highlight"><b>'+esc(k)+'</b>'+esc(v)+'</div>').join(''):'<p class="subtle">No additional specifications provided.</p>';
$('#description').textContent=p.listing?.description||p.description||'Product description will be updated when verified product information is available.';
$('#cart-count').textContent=cartCount()?'('+cartCount()+')':'';renderWishlistButton();updateProductSchema();renderRelated(p);
}
function updateProductSchema(){if(!product)return;const p=product,images=productUrls(p),count=Number(reviewsData.count)||0,avg=Number(reviewsData.avg)||0,offer={ '@type':'Offer',priceCurrency:'INR',price:String(p.price),url:location.href,availability:p.stock===null?undefined:p.stock>0?'https://schema.org/InStock':'https://schema.org/OutOfStock'};const schema={'@context':'https://schema.org','@type':'Product',name:p.listing?.listingTitle||p.name,description:String(p.listing?.description||p.description||'').slice(0,500),sku:p.id,brand:p.brand?{'@type':'Brand',name:p.brand}:undefined,image:images.length?images:undefined,offers:offer};if(count>0&&avg>0)schema.aggregateRating={'@type':'AggregateRating',ratingValue:avg,reviewCount:count};Object.keys(schema).forEach(k=>schema[k]===undefined&&delete schema[k]);if(schema.offers.availability===undefined)delete schema.offers.availability;$('#product-jsonld').textContent=JSON.stringify(schema)}
function renderWishlistButton(){const ids=stored('tl_wl'),list=Array.isArray(ids)?ids.map(String):[],saved=list.includes(id),b=$('#wishlist');if(b){b.textContent=saved?'♥ Saved to wishlist':'♡ Save to wishlist';b.setAttribute('aria-pressed',String(saved))}}
function productCategory(p){return String(p.cat||p.category||p.categoryName||'').trim().toLowerCase()}
function productTerms(p){return String([p.name,p.cat,p.category,p.material,p.style,p.color,p.colour,p.occasion,p.type,p.brand].filter(Boolean).join(' ')).toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>2&&!['with','and','for','the','new','set'].includes(w))}
function recommendationScore(candidate,current){let score=0;const cat=productCategory(current);if(cat&&productCategory(candidate)===cat)score+=8;const a=new Set(productTerms(current));for(const term of productTerms(candidate))if(a.has(term))score+=2;if(Number.isFinite(Number(candidate.price))&&Number(candidate.price)>0){const ratio=Number(candidate.price)/Math.max(1,Number(current.price));if(ratio>=.65&&ratio<=1.35)score+=1}if(catalogueSignals.trending.includes(candidate.id)||candidate.trending===true||candidate.isTrending===true)score+=3;if(catalogueSignals.bestsellers.includes(candidate.id)||candidate.bestseller===true||candidate.isBestseller===true)score+=3;return score}
function recommendationCard(p){const urls=productUrls(p),title=p.listing?.listingTitle||p.name,img=urls.length?'<img loading="lazy" src="'+esc(urls[0])+'" alt="'+esc(title)+'">':esc(title);return '<a class="related-card" href="/product.html?p='+encodeURIComponent(p.id)+'" target="_blank" rel="noopener noreferrer" data-recommended-product="'+esc(p.id)+'"><div class="related-image">'+img+'</div><div class="related-copy"><div class="related-name">'+esc(title)+'</div><div class="related-price">'+money(p.price)+'</div></div></a>'}
function renderRecommendationRail(host,items,emptyText){if(!host)return;host.innerHTML=items.length?items.map(recommendationCard).join(''):'<div class="subtle">'+emptyText+'</div>';host.querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>{const parent=img.parentElement;img.remove();parent.classList.add('no-image');parent.textContent='Product photo coming soon'},{once:true}))}
function renderRelated(current){const eligible=catalogueProducts.filter(p=>p&&p.id!==current.id&&p.price>0&&p.price<=500&&String(p.showOnSite||'yes').toLowerCase()!=='no');const ranked=eligible.map(p=>({p,score:recommendationScore(p,current)})).sort((a,b)=>b.score-a.score||a.p.name.localeCompare(b.p.name));const category=ranked.filter(x=>productCategory(x.p)===productCategory(current));const popular=ranked.filter(x=>catalogueSignals.bestsellers.includes(x.p.id)||catalogueSignals.trending.includes(x.p.id)||x.p.bestseller===true||x.p.isBestseller===true||x.p.trending===true||x.p.isTrending===true);const preferredPeople=[...popular.map(x=>x.p),...category.map(x=>x.p)].filter((p,i,a)=>a.findIndex(q=>q.id===p.id)===i);const peopleItems=(preferredPeople.length?preferredPeople:ranked.map(x=>x.p)).slice(0,4);const similarPool=category.length?category:ranked;let similarItems=similarPool.filter(x=>!peopleItems.some(p=>p.id===x.p.id)).slice(0,4).map(x=>x.p);if(!similarItems.length)similarItems=ranked.filter(x=>!peopleItems.some(p=>p.id===x.p.id)).slice(0,4).map(x=>x.p);renderRecommendationRail($('#people-also-viewed-grid'),peopleItems,'We are building this recommendation list as more product activity becomes available.');renderRecommendationRail($('#related-grid'),similarItems.length?similarItems:category.slice(0,4).map(x=>x.p),'More similar products will appear here as the catalogue grows.')}

function cartCount(){const c=stored('tl_cart');return Array.isArray(c)?c.reduce((n,x)=>n+Math.max(0,Number(x.n)||0),0):0}
function etaForPin(pin){const fast=/^(600|641)/.test(pin),format=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})};return fast?format(2)+' – '+format(3):format(3)+' – '+format(5)}
async function checkDelivery(){const input=$('#delivery-pin'),result=$('#delivery-result'),button=$('#check-pin'),pin=String(input.value||'').replace(/\D/g,'');if(!/^\d{6}$/.test(pin)){result.className='delivery-result error';result.textContent='Enter a valid 6-digit pincode.';return}button.disabled=true;button.textContent='Checking…';result.className='delivery-result';result.textContent='Checking delivery availability…';try{const r=await fetch('/api/pincode?pin='+encodeURIComponent(pin),{cache:'no-store'}),d=await r.json();if(!r.ok||!d||!d.ok)throw Error('Could not verify this pincode right now.');if(d.found===false){result.className='delivery-result error';result.textContent='We could not find this pincode. Please check it.';return}if(!d.serviceable){result.className='delivery-result error';result.textContent='Juno currently delivers only to supported Tamil Nadu pincodes.';return}save('tl_pin',pin);result.className='delivery-result ok';result.textContent='✓ Delivery available to '+pin+(d.district?' ('+d.district+')':'')+' · estimated '+etaForPin(pin);toast('Delivery available for this pincode')}catch(e){result.className='delivery-result error';result.textContent=e.message||'Delivery availability could not be verified. Please check again at checkout.'}finally{button.disabled=false;button.textContent='Check'}}
function addToCart(buy){if(!product)return;const available=product.stock;if(available===0)return toast('This product is out of stock.');if(!selected)return toast('Please select a size, colour or option first.');const cart=stored('tl_cart');const items=Array.isArray(cart)?cart:[];const existing=items.find(x=>String(x.id)===product.id&&String(x.s)===selected);const current=existing?Number(existing.n)||0:0;if(current+quantity>20)return toast('Maximum 20 units per product per order.');if(available!==null&&current+quantity>available)return toast('Only '+Math.max(0,available-current)+' more available.');if(existing)existing.n=current+quantity;else items.push({id:product.id,s:selected,n:quantity});save('tl_cart',items);$('#cart-count').textContent='('+cartCount()+')';if(buy){location.href='/?checkout=1';return}toast('Added to cart');}
function showPhoto(i){if(!photos[i])return;const main=$('#main-image');if(main){main.src=photos[i];main.alt=(product.listing?.listingTitle||product.name)+' photo '+(i+1)}document.querySelectorAll('.thumb').forEach((b,j)=>b.classList.toggle('on',i===j))}
function renderRatings(data){reviewsData=data||{count:0,avg:0,list:[]};const list=Array.isArray(reviewsData.list)?reviewsData.list:[],count=Number(reviewsData.count)||list.length,avg=Number(reviewsData.avg)||0;const inline=$('#rating-inline');if(inline)inline.innerHTML=reviewsData.unavailable?'<span class="subtle">Ratings temporarily unavailable</span>':count?'<span class="rating-pill">★ '+avg.toFixed(1)+'</span><a class="subtle" href="#reviews-section">'+count+' rating'+(count===1?'':'s')+' · '+list.length+' review'+(list.length===1?'':'s')+'</a>':'<span class="subtle">No customer ratings yet</span>';
const summary=reviewsData.unavailable?'<div class="empty">Ratings could not be loaded right now. Please try again later.</div>':count?'<div class="rating-summary"><div class="big-rating">'+avg.toFixed(1)+' <span class="stars">★</span><small>'+count+' rating'+(count===1?'':'s')+' · '+list.length+' written review'+(list.length===1?'':'s')+'</small></div>'+(count===list.length?'<div class="distribution">'+[5,4,3,2,1].map(n=>{const k=list.filter(x=>Number(x.rating)===n).length,pct=list.length?Math.round(k/list.length*100):0;return '<div class="dist-row"><span>'+n+' star</span><div class="track"><div class="fill" style="width:'+pct+'%"></div></div><span>'+k+'</span></div>'}).join('')+'</div>':'<div class="subtle">Average reflects all approved ratings; the latest '+list.length+' written reviews are shown below.</div>')+'</div>':'<div class="empty">No customer ratings yet. Be the first buyer to share feedback after your purchase.</div>';
['#reviews-summary','#reviews-summary-inline'].forEach(sel=>{const el=$(sel);if(el)el.innerHTML=summary});['#review-count-label','#review-count-inline'].forEach(sel=>{const el=$(sel);if(el)el.textContent=reviewsData.unavailable?'Ratings temporarily unavailable':count?count+' ratings · '+list.length+' written reviews':'No ratings yet'});
const html=reviewsData.unavailable?'<div class="empty">We could not load reviews at this moment.</div>':list.length?list.map(x=>'<article class="review"><div class="review-title"><span class="stars">'+('★'.repeat(Math.max(0,Math.min(5,Number(x.rating)||0))))+'<span style="color:#d8d1dc">'+('★'.repeat(5-Math.max(0,Math.min(5,Number(x.rating)||0))))+'</span></span><small>'+esc(x.date||'')+'</small></div><p style="margin:5px 0"><b>'+esc(x.name||'Juno customer')+'</b> '+(x.verified?'<span class="subtle">· Verified purchase</span>':'')+'</p><p style="margin:0">'+esc(x.comment||'')+'</p></article>').join(''):'<div class="empty">No written reviews to display yet.</div>';
['#reviews-list','#reviews-list-inline'].forEach(sel=>{const el=$(sel);if(el)el.innerHTML=html});updateProductSchema();if($('#reviews-section'))$('#reviews-section').hidden=false;
const auth=stored('tl_session');const logged=auth&&auth.token;
const form=logged?'<button class="btn secondary" type="button" id="write-review">Write a review</button><div id="review-form" hidden class="review-form"><label>Rating <select id="review-rating"><option value="">Choose stars</option><option value="5">5 — Excellent</option><option value="4">4 — Good</option><option value="3">3 — Average</option><option value="2">2 — Poor</option><option value="1">1 — Very poor</option></select></label><textarea id="review-comment" maxlength="500" placeholder="Share your experience with this product"></textarea><div class="error" id="review-error"></div><button type="button" class="btn primary" id="submit-review">Submit review</button></div>':'<p class="subtle">Want to review this product? <a href="/?login=1" style="color:var(--pink);font-weight:700">Log in to Juno</a> after purchasing.</p>';
['#review-write','#review-write-inline'].forEach(sel=>{const el=$(sel);if(el)el.innerHTML=form});
}
async function loadReviews(){try{const r=await fetch('/api/reviews?pid='+encodeURIComponent(id),{headers:{Accept:'application/json'},cache:'no-store'});if(!r.ok)throw Error('Reviews unavailable');const d=await r.json();renderRatings(d)}catch(_){renderRatings({count:0,avg:0,list:[],unavailable:true})}}
function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(c!=='\r')cell+=c}if(cell.length||row.length){row.push(cell);rows.push(row)}return rows}
async function fromCsv(){const r=await fetch('/api/products',{cache:'no-store'});if(!r.ok)throw Error('Live catalogue unavailable');const rows=parseCsv(await r.text());if(rows.length<2)throw Error('No catalogue rows');const h=rows[0].map(x=>x.trim().toLowerCase().replace(/\s*\(.*\)\s*$/,'')),ix=n=>h.indexOf(n),get=(row,n)=>ix(n)>=0?String(row[ix(n)]||'').trim():'';for(const row of rows.slice(1)){if(get(row,'product id')!==id)continue;const raw=get(row,'sizes/colours').split(/[|,]/).map(x=>x.trim()).filter(Boolean),price=Number(get(row,'selling price').replace(/[^\d.]/g,''))||0,mrp=Number(get(row,'mrp').replace(/[^\d.]/g,''))||price,sz=raw.length>0&&raw.every(x=>/^(XXS|XS|S|M|L|XL|XXL|3XL|4XL|5XL|\d{1,2}(?:-\d{1,2}Y)?)$/i.test(x));const imageValues=h.map((name,j)=>({name,j})).filter(x=>/^(?:ai image [1-5]|image(?: url)?(?: [1-6])?|additional image [1-5]|additional images|gallery images|product image|primary image)$/.test(x.name)).flatMap(x=>{const value=String(row[x.j]||'').trim();return /^(?:additional images|gallery images)$/i.test(x.name)?value.split(/[|;]/):[value]}).filter(Boolean);return normalizeProduct({id,name:get(row,'product name'),cat:get(row,'category'),brand:get(row,'details'),g:get(row,'for'),price,mrp,stock:get(row,'stock')===''?null:Number(get(row,'stock').replace(/[^\d.]/g,'')),sizes:raw,sz,img:imageValues[0]||get(row,'image')||get(row,'image url')||get(row,'product image'),images:imageValues,material:get(row,'material'),style:get(row,'style'),occasion:get(row,'occasion'),description:get(row,'description')})}return null}
async function loadProduct(){if(!id){$('#status').textContent='No product was selected. Browse the Juno catalogue to choose a product.';return}try{let bundled=null,live=null;try{const r=await fetch('/catalog.json',{cache:'no-store'});if(r.ok){const d=await r.json();if(Array.isArray(d.products)){catalogueProducts=d.products.map(normalizeProduct).filter(p=>p&&p.price>0&&p.price<=500);bundled=normalizeProduct(d.products.find(x=>String(x.id)===id))}}}catch(_){}try{live=await fromCsv()}catch(_){}let p;if(bundled&&live){p=normalizeProduct({...bundled,...live,listing:bundled.listing||live.listing,images:live.images&&live.images.length?live.images:bundled.images,img:live.img||bundled.img,fallbackImg:live.fallbackImg||bundled.fallbackImg,sizes:live.sizes&&live.sizes.length?live.sizes:bundled.sizes,sz:live.sizes&&live.sizes.length?live.sz:bundled.sz,stock:live.stock!==null?live.stock:bundled.stock,price:live.price>0?live.price:bundled.price,mrp:live.mrp>0?live.mrp:bundled.mrp,description:live.description||bundled.description})}else p=live||bundled;if(!p||p.price<=0||p.price>500){$('#status').textContent='This product is unavailable. Please return to the catalogue.';return}try{const sr=await fetch('/api/signals',{cache:'no-store'});if(sr.ok){const sd=await sr.json();catalogueSignals={bestsellers:Array.isArray(sd.bestsellers)?sd.bestsellers.map(String):[],trending:Array.isArray(sd.trending)?sd.trending.map(String):[]}}}catch(_){}renderProduct(p);if(stored('tl_cookie')==='all'){const viewed=stored('tl_rv');save('tl_rv',[id,...(Array.isArray(viewed)?viewed:[]).filter(x=>String(x)!==id)].slice(0,12))}const main=$('#main-image');if(main)main.addEventListener('error',()=>{main.remove();$('.hero').insertAdjacentHTML('beforeend','<div class="fallback"><strong>Photo unavailable</strong><p>We will add a verified product photo when one is available.</p></div>')},{once:true});document.querySelectorAll('.thumb img').forEach(img=>img.addEventListener('error',()=>img.closest('.thumb')?.remove(),{once:true}));await loadReviews()}catch(e){$('#status').textContent='Product details could not be loaded right now. Please return to the catalogue and try again.';console.error('Juno product page load failed:',e)}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='check-pin'){checkDelivery();return}if(b.id==='wishlist'){const old=stored('tl_wl'),ids=Array.isArray(old)?old.map(String):[],at=ids.indexOf(id);if(at>=0)ids.splice(at,1);else ids.push(id);save('tl_wl',ids);renderWishlistButton();toast(at>=0?'Removed from wishlist':'Saved to wishlist');return}if(b.dataset.option!==undefined){selected=b.dataset.option;document.querySelectorAll('[data-option]').forEach(x=>{const on=x.dataset.option===selected;x.classList.toggle('on',on);x.setAttribute('aria-pressed',String(on))});return}if(b.dataset.photo!==undefined){showPhoto(Number(b.dataset.photo));return}if(b.id==='minus'){quantity=Math.max(1,quantity-1);$('#qty').textContent=quantity;return}if(b.id==='plus'){quantity=Math.min(20,quantity+1);$('#qty').textContent=quantity;return}if(b.id==='add'){addToCart(false);return}if(b.id==='buy'){addToCart(true);return}if(b.id==='write-review'){document.querySelectorAll('#review-form').forEach(x=>x.hidden=false);return}if(b.id==='submit-review'){const auth=stored('tl_session'),rating=Number($('#review-rating')?.value),comment=($('#review-comment')?.value||'').trim(),err=$('#review-error');if(!rating){err.textContent='Choose a star rating.';return}if(comment.length<3){err.textContent='Write at least 3 characters.';return}b.disabled=true;try{const r=await fetch('/api/add-review',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+auth.token},body:JSON.stringify({pid:id,rating,comment})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not submit review');toast('Thanks for your review');await loadReviews()}catch(x){err.textContent=x.message||'Could not submit review'}finally{b.disabled=false}}});
$('#search-form').addEventListener('submit',e=>{e.preventDefault();location.href='/?q='+encodeURIComponent($('#search').value.trim())});
$('#back').addEventListener('click',e=>{try{if(history.length>1&&document.referrer&&new URL(document.referrer).origin===location.origin){e.preventDefault();history.back()}}catch(_){}});
loadProduct();
</script>
