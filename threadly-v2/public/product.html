<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d9186c">
<title>Product details | Juno</title>
<meta name="description" content="View product details, options, availability and customer reviews at Juno.">
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{--ink:#24202a;--mut:#716b78;--line:#ece7ef;--bg:#fff;--soft:#faf7fa;--pink:#d9186c;--green:#16834a;--amber:#a96700;--shadow:0 8px 30px #24142a0d}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#fff;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button,a{touch-action:manipulation}a{color:inherit;text-decoration:none}.top{background:#fff1f7;text-align:center;padding:7px 12px;font-size:12px}.header{border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}.head{max-width:1180px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:18px}.logo{font-size:25px;font-weight:850;color:var(--pink);letter-spacing:-1px}.search{flex:1}.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:#faf8fb;outline-color:var(--pink)}.links{display:flex;gap:14px;align-items:center;font-size:13px}.links a:hover{color:var(--pink)}main{max-width:1180px;margin:auto;padding:18px}.crumb{font-size:12px;color:var(--mut);margin:2px 0 18px}.crumb a:hover{color:var(--pink)}.layout{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(360px,.98fr);gap:30px;align-items:start}.gallery{display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;position:sticky;top:90px}.thumbs{display:flex;flex-direction:column;gap:8px}.thumb{border:1px solid var(--line);border-radius:9px;padding:3px;background:#fff;aspect-ratio:1;cursor:pointer;overflow:hidden}.thumb.on{border:2px solid var(--pink)}.thumb img{width:100%;height:100%;object-fit:contain}.hero{aspect-ratio:4/5;background:linear-gradient(145deg,#fff6fa,#f4eff8);border-radius:12px;overflow:hidden;display:grid;place-items:center;position:relative}.hero img{width:100%;height:100%;object-fit:contain}.hero .fallback{padding:28px;text-align:center;color:#7d4a6a}.hero .fallback strong{display:block;font-size:clamp(24px,4vw,38px);line-height:1.15}.badge{position:absolute;top:12px;left:12px;background:#fff;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:750;box-shadow:var(--shadow)}.info{min-width:0}.brand{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);font-weight:750}.title{font-size:clamp(23px,3vw,32px);line-height:1.2;letter-spacing:-.7px;margin:4px 0 12px}.rating{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:8px 0 15px}.rating-pill{display:inline-flex;align-items:center;gap:5px;border:1px solid #cce8d5;background:#f1fbf4;color:#17673a;border-radius:7px;padding:4px 8px;font-weight:750}.subtle{color:var(--mut);font-size:13px}.pricebox{padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.price-line{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}.price{font-size:32px;font-weight:850;letter-spacing:-1px}.mrp{color:#8b8490;text-decoration:line-through}.discount{color:#16834a;font-weight:750}.tax{font-size:12px;color:var(--mut)}.stock{margin:15px 0 4px;font-weight:750;font-size:13px}.stock.ok{color:var(--green)}.stock.low{color:var(--amber)}.stock.out{color:#b42318}.stock.unknown{color:var(--mut)}.section{padding:17px 0;border-bottom:1px solid var(--line)}.section h2{font-size:16px;margin:0 0 10px}.options{display:flex;flex-wrap:wrap;gap:8px}.option{border:1px solid #ddd5e2;border-radius:8px;background:#fff;min-width:48px;padding:9px 13px;cursor:pointer}.option.on{border:2px solid var(--pink);color:var(--pink);padding:8px 12px;font-weight:750;background:#fff7fb}.option:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}.quantity{display:flex;align-items:center;gap:13px}.quantity button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:20px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px 0}.btn{border:0;border-radius:9px;padding:13px 15px;font-weight:800;cursor:pointer}.btn.primary{background:var(--pink);color:white}.btn.secondary{background:#fff;color:var(--pink);border:1px solid var(--pink)}.btn:disabled{opacity:.45;cursor:not-allowed}.notice{background:#f8f4fb;border-radius:9px;padding:12px 14px;color:#514758;font-size:13px}.pdp-section{margin-top:24px;border:1px solid var(--line);border-radius:12px;padding:18px}.pdp-section h2{font-size:19px;margin:0 0 12px}.highlights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.highlight{background:var(--soft);padding:10px 12px;border-radius:8px;font-size:13px}.highlight b{display:block;font-size:11px;color:var(--mut);font-weight:650;margin-bottom:3px}.description{white-space:pre-line;color:#514b57}.reviews-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.rating-summary{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:center;padding:12px 0}.big-rating{font-size:36px;font-weight:850}.big-rating small{display:block;font-size:12px;color:var(--mut);font-weight:500}.distribution{display:grid;gap:6px}.dist-row{display:grid;grid-template-columns:74px 1fr 30px;gap:8px;align-items:center;font-size:12px;color:var(--mut)}.track{height:7px;background:#eee8ef;border-radius:9px;overflow:hidden}.fill{height:100%;background:#f2b21a;border-radius:9px}.review{border-top:1px solid var(--line);padding:13px 0}.review-title{display:flex;justify-content:space-between;gap:8px;align-items:center}.stars{color:#eba900;letter-spacing:1px}.review-form{display:grid;gap:10px;margin-top:12px}.review-form textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;min-height:90px}.error{color:#b42318;font-size:13px}.empty{padding:20px;text-align:center;color:var(--mut)}.footer{border-top:1px solid var(--line);padding:24px 18px;text-align:center;color:var(--mut);font-size:12px;margin-top:40px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#24202a;color:#fff;padding:11px 16px;border-radius:9px;z-index:20;display:none;max-width:calc(100% - 28px)}.toast.show{display:block}.back{display:inline-flex;align-items:center;gap:6px;margin:2px 0 12px;color:var(--mut);font-size:13px}.back:hover{color:var(--pink)}@media(max-width:760px){.head{padding:10px 13px;gap:12px;flex-wrap:wrap}.logo{font-size:23px}.search{order:3;flex-basis:100%}.links{margin-left:auto}.links a:nth-child(2){display:none}main{padding:12px}.layout{grid-template-columns:1fr;gap:18px}.gallery{position:static;grid-template-columns:54px minmax(0,1fr);gap:8px}.thumbs{gap:6px}.hero{aspect-ratio:1/1;max-height:520px}.title{font-size:25px}.price{font-size:29px}.info{padding:0 2px}.pdp-section{padding:14px;margin-top:16px}.rating-summary{grid-template-columns:100px 1fr;gap:10px}.highlights{grid-template-columns:1fr 1fr}.actions{position:sticky;bottom:0;background:#fff;padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:4}.footer{margin-top:24px}}@media(max-width:390px){.links{gap:8px}.links a{font-size:12px}.gallery{grid-template-columns:44px minmax(0,1fr)}.option{padding:8px 10px;min-width:42px}.option.on{padding:7px 9px}.highlights{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">Budget-friendly finds · Prices capped at ₹500 · Prepaid checkout only</div>
<header class="header"><div class="head"><a class="logo" href="/" aria-label="Juno home">Juno</a><div class="search"><form id="search-form"><input id="search" type="search" placeholder="Search products, styles and accessories" aria-label="Search products"></form></div><div class="links"><a href="/?browse=1">Shop all</a><a href="/?wishlist=1">Wishlist</a><a href="/?cart=1">Cart <span id="cart-count"></span></a></div></div></header>
<main>
<a class="back" href="/" id="back">← Back to shopping</a>
<div class="crumb" id="crumb">Home / Product details</div>
<div id="status" class="empty">Loading product details…</div>
<div id="product" hidden></div>
</main>
<footer class="footer">Juno · Budget-friendly fashion and accessories · <a href="/refund-policy.html">Returns policy</a> · <a href="/contact.html">Contact</a></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');
const params=new URLSearchParams(location.search),id=params.get('p')||params.get('id')||'';
const stored=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(_){return null}},save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}};
let product=null, selected='', quantity=1, reviewsData={count:0,avg:0,list:[]}, reviewRating=0, photos=[];
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2400)}
function productUrls(p){return [...new Set([...(Array.isArray(p.images)?p.images:[]),p.img,p.fallbackImg].filter(x=>typeof x==='string'&&x.trim()).map(x=>x.trim()))].slice(0,6)}
function normalizeProduct(p){if(!p||!p.id||!p.name)return null;const price=Number(p.price??p.sellingPrice??p.selling_price)||0,mrp=Number(p.mrp)||price;return {...p,id:String(p.id),name:String(p.name),price,mrp,stock:p.stock!=null&&p.stock!==''&&Number.isFinite(Number(p.stock))?Number(p.stock):null,sizes:Array.isArray(p.sizes)?p.sizes.map(String).filter(Boolean):[],images:productUrls(p),listing:p.listing&&typeof p.listing==='object'?p.listing:null}}
function stockMarkup(p){if(p.stock===null)return '<div class="stock unknown">Availability will be confirmed at checkout.</div>';if(p.stock<=0)return '<div class="stock out" role="status">● Out of stock</div>';if(p.stock<=5)return '<div class="stock low" role="status">● In stock · Limited availability</div>';return '<div class="stock ok" role="status">● In stock</div>'}
function optionMarkup(p){if(!p.sizes.length)return '<p class="subtle">No size or colour options were provided for this listing.</p>';const label=p.sz?'Select size':'Select colour / option';return '<h2>'+label+'</h2><div class="options" id="options">'+p.sizes.map((s,i)=>'<button class="option'+(selected===s?' on':'')+'" type="button" data-option="'+esc(s)+'" aria-pressed="'+(selected===s)+'">'+esc(s)+'</button>').join('')+'</div>'+(p.sz?'<p class="subtle">Choose the option that matches your needs. Product-specific measurements are shown below when supplied.</p>':'')}
function highlights(p){const l=p.listing||{},spec=l.specifications&&typeof l.specifications==='object'?Object.entries(l.specifications):[],attrs=[['Category',p.cat||p.category],['Colour',p.color||p.colour],['Material',p.material],['Style',p.style],['Occasion',p.occasion],['Product type',p.type||p.productType],...spec].filter(x=>String(x[1]??'').trim());const seen=new Set();return attrs.filter(([k])=>{const key=String(k).toLowerCase();if(seen.has(key))return false;seen.add(key);return true}).slice(0,16)}
function renderProduct(p){product=p;selected=p.sizes.length===1?p.sizes[0]:'';photos=productUrls(p);const title=p.listing?.listingTitle||p.listingTitle||p.name,off=p.mrp>p.price?Math.round((p.mrp-p.price)/p.mrp*100):0;
document.title=title+' | Juno';$('meta[name="description"]').content=String(p.listing?.description||p.description||('Shop '+title+' at Juno.')).slice(0,155);$('#crumb').textContent='Home / '+(p.cat||'Shop')+' / '+title;
$('#status').hidden=true;$('#product').hidden=false;
const image=photos.length?'<img id="main-image" src="'+esc(photos[0])+'" alt="'+esc(title)+'" fetchpriority="high">':'<div class="fallback"><strong>'+esc(title)+'</strong><p>Product photo not available yet</p><small>We will add a verified product photo when one is available.</small></div>';
$('#product').innerHTML='<div class="layout"><section><div class="gallery"><div class="thumbs" id="thumbs">'+photos.map((u,i)=>'<button type="button" class="thumb'+(!i?' on':'')+'" data-photo="'+i+'" aria-label="Show product photo '+(i+1)+'"><img src="'+esc(u)+'" alt="" loading="lazy"></button>').join('')+'</div><div class="hero">'+image+(off?'<span class="badge">'+off+'% off</span>':'')+'</div></div></section><section class="info"><div class="brand">'+esc(p.brand||'Juno collection')+'</div><h1 class="title">'+esc(title)+'</h1><div id="rating-inline" class="rating"><span class="subtle">Loading customer ratings…</span></div><div class="pricebox"><div class="price-line"><span class="price">'+money(p.price)+'</span>'+(p.mrp>p.price?'<span class="mrp">'+money(p.mrp)+'</span><span class="discount">'+off+'% off</span>':'')+'</div><div class="tax">Inclusive of listed price. Delivery fee, if applicable, is shown at checkout.</div>'+stockMarkup(p)+'</div><section class="section" id="variant-section">'+optionMarkup(p)+'</section><section class="section"><h2>Quantity</h2><div class="quantity"><button type="button" id="minus" aria-label="Decrease quantity">−</button><b id="qty">1</b><button type="button" id="plus" aria-label="Increase quantity">+</button><span class="subtle">Maximum 20 per order</span></div></section><div class="actions"><button type="button" class="btn primary" id="add" '+(p.stock===0?'disabled':'')+'>Add to cart</button><button type="button" class="btn secondary" id="buy" '+(p.stock===0?'disabled':'')+'>Buy now</button></div><div class="notice">✓ Prepaid payments only · COD is not available<br>✓ Tamil Nadu delivery coverage is checked at checkout<br>✓ Returns follow Juno’s published policy</div></section></div><section class="pdp-section"><h2>Product highlights</h2><div class="highlights" id="highlights"></div><h2 style="margin-top:20px">Product details</h2><p class="description" id="description"></p><details><summary>Specifications</summary><div class="highlights" id="specs" style="margin-top:10px"></div></details></section><section class="pdp-section" id="reviews-section"><div class="reviews-head"><h2>Ratings &amp; customer reviews</h2><span class="subtle" id="review-count-inline"></span></div><div id="reviews-summary-inline"></div><p class="subtle">Only reviews actually submitted to Juno are counted here. No sample or invented ratings are included.</p><div id="reviews-list-inline"></div><div id="review-write-inline"></div></section><section class="pdp-section" id="related"><h2>Explore more</h2><p class="subtle">Find more affordable accessories and fashion on Juno.</p><a class="btn secondary" href="/?browse=1">Continue shopping</a></section>';
const attrs=highlights(p);$('#highlights').innerHTML=attrs.length?attrs.slice(0,8).map(([k,v])=>'<div class="highlight"><b>'+esc(k)+'</b>'+esc(v)+'</div>').join(''):'<div class="subtle">More product attributes will be added when verified details are available.</div>';
$('#specs').innerHTML=attrs.length?attrs.map(([k,v])=>'<div class="highlight"><b>'+esc(k)+'</b>'+esc(v)+'</div>').join(''):'<p class="subtle">No additional specifications provided.</p>';
$('#description').textContent=p.listing?.description||p.description||'Product description will be updated when verified product information is available.';
$('#cart-count').textContent=cartCount()?'('+cartCount()+')':'';
}
function cartCount(){const c=stored('tl_cart');return Array.isArray(c)?c.reduce((n,x)=>n+Math.max(0,Number(x.n)||0),0):0}
function addToCart(buy){if(!product)return;const available=product.stock;if(available===0)return toast('This product is out of stock.');if(!selected)return toast('Please select a size, colour or option first.');const cart=stored('tl_cart');const items=Array.isArray(cart)?cart:[];const existing=items.find(x=>String(x.id)===product.id&&String(x.s)===selected);const current=existing?Number(existing.n)||0:0;if(current+quantity>20)return toast('Maximum 20 units per product per order.');if(available!==null&&current+quantity>available)return toast('Only '+Math.max(0,available-current)+' more available.');if(existing)existing.n=current+quantity;else items.push({id:product.id,s:selected,n:quantity});save('tl_cart',items);$('#cart-count').textContent='('+cartCount()+')';if(buy){location.href='/?checkout=1';return}toast('Added to cart');}
function showPhoto(i){if(!photos[i])return;const main=$('#main-image');if(main){main.src=photos[i];main.alt=(product.listing?.listingTitle||product.name)+' photo '+(i+1)}document.querySelectorAll('.thumb').forEach((b,j)=>b.classList.toggle('on',i===j))}
function renderRatings(data){reviewsData=data||{count:0,avg:0,list:[]};const list=Array.isArray(reviewsData.list)?reviewsData.list:[],count=Number(reviewsData.count)||list.length,avg=Number(reviewsData.avg)||0;const inline=$('#rating-inline');if(inline)inline.innerHTML=count?'<span class="rating-pill">★ '+avg.toFixed(1)+'</span><a class="subtle" href="#reviews-section">'+count+' rating'+(count===1?'':'s')+' · '+list.length+' review'+(list.length===1?'':'s')+'</a>':'<span class="subtle">No customer ratings yet</span>';
const summary=count?'<div class="rating-summary"><div class="big-rating">'+avg.toFixed(1)+' <span class="stars">★</span><small>'+count+' rating'+(count===1?'':'s')+' · '+list.length+' written review'+(list.length===1?'':'s')+'</small></div><div class="distribution">'+[5,4,3,2,1].map(n=>{const k=list.filter(x=>Number(x.rating)===n).length,pct=list.length?Math.round(k/list.length*100):0;return '<div class="dist-row"><span>'+n+' star</span><div class="track"><div class="fill" style="width:'+pct+'%"></div></div><span>'+k+'</span></div>'}).join('')+'</div></div>':'<div class="empty">No customer ratings yet. Be the first verified buyer to share feedback after purchasing.</div>';
['#reviews-summary','#reviews-summary-inline'].forEach(sel=>{const el=$(sel);if(el)el.innerHTML=summary});['#review-count-label','#review-count-inline'].forEach(sel=>{const el=$(sel);if(el)el.textContent=count?count+' ratings · '+list.length+' written reviews':'No ratings yet'});
const html=list.length?list.map(x=>'<article class="review"><div class="review-title"><span class="stars">'+('★'.repeat(Math.max(0,Math.min(5,Number(x.rating)||0))))+'<span style="color:#d8d1dc">'+('★'.repeat(5-Math.max(0,Math.min(5,Number(x.rating)||0))))+'</span></span><small>'+esc(x.date||'')+'</small></div><p style="margin:5px 0"><b>'+esc(x.name||'Juno customer')+'</b> '+(x.verified?'<span class="subtle">· Verified purchase</span>':'')+'</p><p style="margin:0">'+esc(x.comment||'')+'</p></article>').join(''):'<div class="empty">No written reviews to display yet.</div>';
['#reviews-list','#reviews-list-inline'].forEach(sel=>{const el=$(sel);if(el)el.innerHTML=html});if($('#reviews-section'))$('#reviews-section').hidden=false;
const auth=stored('tl_session');const logged=auth&&auth.token;
const form=logged?'<button class="btn secondary" type="button" id="write-review">Write a review</button><div id="review-form" hidden class="review-form"><label>Rating <select id="review-rating"><option value="">Choose stars</option><option value="5">5 — Excellent</option><option value="4">4 — Good</option><option value="3">3 — Average</option><option value="2">2 — Poor</option><option value="1">1 — Very poor</option></select></label><textarea id="review-comment" maxlength="500" placeholder="Share your experience with this product"></textarea><div class="error" id="review-error"></div><button type="button" class="btn primary" id="submit-review">Submit review</button></div>':'<p class="subtle">Want to review this product? <a href="/?login=1" style="color:var(--pink);font-weight:700">Log in to Juno</a> after purchasing.</p>';
['#review-write','#review-write-inline'].forEach(sel=>{const el=$(sel);if(el)el.innerHTML=form});
}
async function loadReviews(){try{const r=await fetch('/api/reviews?pid='+encodeURIComponent(id),{headers:{Accept:'application/json'},cache:'no-store'});if(!r.ok)throw Error('Reviews unavailable');const d=await r.json();renderRatings(d)}catch(_){renderRatings({count:0,avg:0,list:[]})}}
async function loadProduct(){if(!id){$('#status').textContent='No product was selected. Browse the Juno catalogue to choose a product.';return}try{const r=await fetch('/catalog.json',{cache:'no-store'});if(!r.ok)throw Error('Catalogue unavailable');const d=await r.json();if(!Array.isArray(d.products))throw Error('Catalogue format is invalid');const p=normalizeProduct(d.products.find(x=>String(x.id)===id));if(!p||p.price<=0||p.price>500){$('#status').textContent='This product is unavailable. Please return to the catalogue.';return}renderProduct(p);await loadReviews()}catch(e){$('#status').textContent='Product details could not be loaded right now. Please return to the catalogue and try again.';console.error('Juno product page load failed:',e)}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.option!==undefined){selected=b.dataset.option;document.querySelectorAll('[data-option]').forEach(x=>{const on=x.dataset.option===selected;x.classList.toggle('on',on);x.setAttribute('aria-pressed',String(on))});return}if(b.dataset.photo!==undefined){showPhoto(Number(b.dataset.photo));return}if(b.id==='minus'){quantity=Math.max(1,quantity-1);$('#qty').textContent=quantity;return}if(b.id==='plus'){quantity=Math.min(20,quantity+1);$('#qty').textContent=quantity;return}if(b.id==='add'){addToCart(false);return}if(b.id==='buy'){addToCart(true);return}if(b.id==='write-review'){document.querySelectorAll('#review-form').forEach(x=>x.hidden=false);return}if(b.id==='submit-review'){const auth=stored('tl_session'),rating=Number($('#review-rating')?.value),comment=($('#review-comment')?.value||'').trim(),err=$('#review-error');if(!rating){err.textContent='Choose a star rating.';return}if(comment.length<3){err.textContent='Write at least 3 characters.';return}b.disabled=true;try{const r=await fetch('/api/add-review',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+auth.token},body:JSON.stringify({pid:id,rating,comment})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not submit review');toast('Thanks for your review');await loadReviews()}catch(x){err.textContent=x.message||'Could not submit review'}finally{b.disabled=false}}});
$('#search-form').addEventListener('submit',e=>{e.preventDefault();location.href='/?q='+encodeURIComponent($('#search').value.trim())});
$('#back').addEventListener('click',e=>{if(history.length>1){e.preventDefault();history.back()}});
loadProduct();
</script>
</body></html>
