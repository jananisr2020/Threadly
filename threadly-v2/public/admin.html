<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="alternate icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#f0287a"><meta name="robots" content="noindex"><title>Juno Admin</title>
<style>
:root{--bg:#fff5f9;--card:#fff;--ink:#16162e;--mut:#6b6d85;--line:#f1dbe6;--acc:#f0287a;--ok:#0f9d58;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#14101c;--card:#1e1830;--ink:#f4f0fa;--mut:#a59fbd;--line:#322a4a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
.hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hd b{font-size:20px;margin-right:8px}.hd b i{font-style:normal;color:var(--acc)}
.tab{border:1px solid var(--line);background:none;border-radius:99px;padding:7px 14px}.tab.on{background:var(--ink);color:var(--bg)}
.wrap{padding:16px;max-width:1400px;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.kpi small{color:var(--mut)}.kpi b{display:block;font-size:24px;margin-top:4px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600;white-space:nowrap}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600}.btn.g{background:none;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.row>*{width:auto}.row input[type=search]{min-width:200px}
.pill{border-radius:99px;padding:2px 9px;font-size:12px;background:var(--line)}.low{color:#d93025;font-weight:600}
.th{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--line)}
.ov{position:fixed;inset:0;background:rgba(10,10,30,.55);display:none;z-index:20;overflow:auto}.ov.show{display:block}
.m{background:var(--card);border-radius:14px;max-width:560px;margin:5vh auto;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.m h2{grid-column:1/-1;margin:0}.m .f{grid-column:1/-1}.m label{display:block;color:var(--mut);font-size:12px;margin-bottom:3px}
#login{max-width:340px;margin:18vh auto;background:var(--card);padding:22px;border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.err{color:#d93025;min-height:18px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;display:none;z-index:30}
.lg{width:28px;height:28px}</style></head><body>
<div id="login"><b style="font-size:22px">Juno <span style="color:var(--acc)">Admin</span></b><input id="pw" type="password" placeholder="Admin password" autocomplete="current-password"><div class="err" id="le"></div><button class="btn" id="lb">Log in</button></div>
<div id="app" style="display:none">
<div class="hd"><b style="display:flex;align-items:center;gap:8px"><svg class='lg' aria-hidden='true' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#ff7eb6'/><stop offset='.55' stop-color='#f0287a'/><stop offset='1' stop-color='#7b3fe4'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(#g)'/><rect x='44' y='20' width='12' height='52' rx='6' fill='#fff'/><rect x='28' y='35' width='44' height='12' rx='6' fill='#fff'/><path d='M50 70q0 10 11 10h9' fill='none' stroke='#fff' stroke-width='12' stroke-linecap='round'/><path d='M28 41C10 41 8 68 30 66' fill='none' stroke='#fff' stroke-opacity='.75' stroke-width='3.5' stroke-linecap='round' stroke-dasharray='1 7'/><circle cx='31' cy='66' r='4' fill='#fff' fill-opacity='.9'/></svg><span>thread<i>ly</i> admin</span></b><button class="tab on" data-t="dash">Dashboard</button><button class="tab" data-t="orders">Orders</button><button class="tab" data-t="prods">Products</button><button class="tab" data-t="sellers">Seller applications</button><button class="tab" data-t="sellerproducts">Seller products</button><button class="tab" data-t="sellerorders">Seller orders</button><button class="tab" data-t="users">Customers</button><button class="tab" data-t="reqs">Returns</button><button class="tab" data-t="revs">Reviews</button><button class="tab" data-t="tix">Tickets</button><span style="flex:1"></span><button class="btn g" id="rf">Refresh</button><button class="btn g" id="lo">Log out</button></div>
<div class="wrap" id="v"></div></div>
<div class="ov" id="ov"><form class="m" id="pf" onsubmit="return false"></form></div><div class="toast" id="ts"></div>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),inr=n=>'₹'+Math.round(+n||0).toLocaleString('en-IN');
let tok=sessionStorage.getItem('tla'),D=null,tab='dash';
const toast=t=>{const e=$('#ts');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)};
async function api(b){const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify(b)}),d=await r.json().catch(()=>({error:'Server error'}));if(r.status===401&&b.action!=='login'){out();throw new Error(d.error)}if(!r.ok)throw new Error(d.error||'Failed');return d}
function out(){tok=null;sessionStorage.removeItem('tla');$('#app').style.display='none';$('#login').style.display=''}
async function load(){try{D=await api({action:'load'});$('#login').style.display='none';$('#app').style.display='';draw()}catch(e){if(tok)toast(e.message)}}
$('#lb').onclick=async()=>{$('#le').textContent='';try{const d=await api({action:'login',password:$('#pw').value});tok=d.token;sessionStorage.setItem('tla',tok);load()}catch(e){$('#le').textContent=e.message}};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#lb').click()};$('#lo').onclick=out;$('#rf').onclick=()=>{load();toast('Refreshed')};
document.querySelector('.hd').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));draw()}};
const ST=['New','Packed','Shipped','Out for delivery','Delivered','Cancelled','Returned'],PAY=['Paid','Pending','COD - collect on delivery','Refunded'];
function draw(){if(!D)return;({dash,orders,prods,users,reqs,revs,tix,sellers,sellerproducts,sellerorders})[tab]()}
function dash(){const o=D.orders.map(x=>x.v),live=o.filter(v=>v[17]!=='Cancelled'),rev=live.reduce((a,v)=>a+(+v[12]||0),0),today=new Date().toLocaleDateString('en-IN'),td=o.filter(v=>String(v[1]).startsWith(today)),low=D.products.filter(p=>p.stock!==''&&+p.stock<=5&&String(p['show on site']).toLowerCase()!=='no');
  $('#v').innerHTML=`<div class="cards"><div class="kpi"><small>Total orders</small><b>${o.length}</b></div><div class="kpi"><small>New (to pack)</small><b>${o.filter(v=>v[17]==='New').length}</b></div><div class="kpi"><small>Revenue</small><b>${inr(rev)}</b></div><div class="kpi"><small>Orders today</small><b>${td.length}</b></div><div class="kpi"><small>Customers</small><b>${D.users.length}</b></div><div class="kpi"><small>Products live</small><b>${D.products.filter(p=>String(p['show on site']).toLowerCase()!=='no').length}</b></div></div>
  <div class="box"><b>Low stock (5 or fewer)</b>${low.length?`<table><tr><th>Product</th><th>Stock</th></tr>${low.map(p=>`<tr><td>${esc(p['product name'])}</td><td class="low">${esc(p.stock)}</td></tr>`).join('')}</table>`:'<p>Nothing is running low.</p>'}</div>`}
function orders(){const f=$('#v').dataset.f||'',q=($('#oq')||{}).value||'';
  const rows=D.orders.slice().reverse().filter(x=>(!f||x.v[17]===f)&&(!q||x.v.join(' ').toLowerCase().includes(q.toLowerCase())));
  $('#v').innerHTML=`<div class="row"><input type="search" id="oq" placeholder="Search order, name, phone, pincode" value="${esc(q)}"><select id="of"><option value="">All statuses</option>${ST.map(s=>`<option${s===f?' selected':''}>${s}</option>`).join('')}</select><button class="btn g" id="ex">Download CSV</button></div>
  <div class="box"><table><tr><th>Order</th><th>Customer</th><th>Deliver to</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Tracking no.</th><th></th></tr>${rows.map(({row,v})=>`<tr data-id="${esc(v[0])}"><td><b>${esc(v[0])}</b><br><small>${esc(v[1])}</small></td><td>${esc(v[2])}<br><small>${esc(v[4])}<br>${esc(v[3])}</small></td><td>${esc(v[5])}<br><small>${esc(v[6])} · by ${esc(v[16])}</small></td><td>${esc(v[7])}</td><td><b>${inr(v[12])}</b><br><small>${v[10]?'coupon −'+inr(v[10]):''}</small></td><td>${esc(v[13])}<br><select class="op">${PAY.map(s=>`<option${s===v[14]?' selected':''}>${s}</option>`).join('')}</select><small>${esc(v[15])}</small></td><td><select class="os">${ST.map(s=>`<option${s===v[17]?' selected':''}>${s}</option>`).join('')}</select></td><td><input class="ot" value="${esc(v[18])}" placeholder="e.g. DTDC123"></td><td><button class="btn sv">Save</button></td></tr>`).join('')||'<tr><td colspan="9">No orders yet.</td></tr>'}</table></div>`;
  $('#of').onchange=e=>{$('#v').dataset.f=e.target.value;orders()};$('#oq').oninput=()=>{const p=$('#oq').selectionStart;orders();$('#oq').focus();$('#oq').setSelectionRange(p,p)};
  $('#ex').onclick=()=>{const h=['Order ID','Date','Name','Email','Mobile','Address','Pincode','Items','Count','Subtotal','Discount','Delivery','Total','Method','Pay status','Payment ID','Expected delivery','Status','Tracking','Notes'],c=[h,...D.orders.map(x=>x.v)].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv'}));a.download='juno-orders.csv';a.click()}}
$('#v').onclick=async e=>{
  if(e.target.classList.contains('sv')){const tr=e.target.closest('tr');try{await api({action:'updateOrder',id:tr.dataset.id,status:tr.querySelector('.os').value,tracking:tr.querySelector('.ot').value,pay:tr.querySelector('.op').value});const x=D.orders.find(o=>o.v[0]===tr.dataset.id);x.v[17]=tr.querySelector('.os').value;x.v[18]=tr.querySelector('.ot').value;x.v[14]=tr.querySelector('.op').value;toast('Order updated')}catch(er){toast(er.message)}}
  if(e.target.classList.contains('rs')){const tr=e.target.closest('tr');try{await api({action:'updateRequest',id:tr.dataset.id,status:tr.querySelector('.rst').value,notes:tr.querySelector('.rnt').value});toast('Saved');load()}catch(er){toast(er.message)}}
  if(e.target.dataset.rf){if(!confirm('Refund the full amount of order '+e.target.dataset.rf+' to the customer through Razorpay?'))return;try{await api({action:'refund',orderId:e.target.dataset.rf});toast('Refund started');load()}catch(er){toast(er.message)}}
  if(e.target.dataset.rh){try{await api({action:'setReview',id:e.target.dataset.rh,status:e.target.dataset.to});toast('Updated');load()}catch(er){toast(er.message)}}
  if(e.target.classList.contains('ts')){const tr=e.target.closest('tr');try{const d=await api({action:'updateTicket',id:tr.dataset.id,status:tr.querySelector('.tst').value,reply:tr.querySelector('.trp').value});toast(d.emailed?'Saved and emailed to the customer':'Saved');load()}catch(er){toast(er.message)}}
  if(e.target.id==='add')edit();const ed=e.target.closest('[data-e]');if(ed)edit(D.products.find(p=>p.row==ed.dataset.e))};
function prods(){const cats=[...new Set(D.products.map(p=>p.category).filter(Boolean))];
  $('#v').innerHTML=`<div class="row"><button class="btn" id="add">+ Add product</button><small>Changes go live on the store within about a minute.</small></div><div class="box"><table><tr><th></th><th>ID</th><th>Product</th><th>Category / For</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr>${D.products.map(p=>`<tr><td>${p.image?`<img class="th" src="${/^https?:/.test(p.image)?esc(p.image):'/images/'+esc(p.image)}" alt="" onerror="this.style.visibility='hidden'">`:'<div class="th"></div>'}</td><td>${esc(p['product id'])}</td><td><b>${esc(p['product name'])}</b><br><small>${esc(p.details)}</small></td><td>${esc(p.category)}<br><small>${esc(p.for)}</small></td><td>${inr(p['selling price'])} <small><s>${inr(p.mrp)}</s></small></td><td class="${p.stock!==''&&+p.stock<=5?'low':''}">${esc(p.stock)}</td><td>${String(p['show on site']).toLowerCase()==='no'?'<span class="pill">Hidden</span>':'<span class="pill" style="background:#e6f6ed;color:#0b6b3a">Live</span>'}${/^y/i.test(p['flash sale'])?' <span class="pill" style="background:#ffe3ef;color:#c0155f">Flash</span>':''}</td><td><button class="btn g" data-e="${p.row}">Edit</button></td></tr>`).join('')}</table></div>`}
function reqs(){const RS=['Requested','Approved','Rejected','Pickup scheduled','Refunded','Closed'],ord=id=>(D.orders.find(o=>o.v[0]===id)||{v:[]}).v;
  $('#v').innerHTML=`<div class="box"><table><tr><th>Request</th><th>Order</th><th>Type / reason</th><th>Status</th><th>Note for customer</th><th></th></tr>${D.requests.slice().reverse().map(({v})=>{const o=ord(v[2]),rf=String(o[15]||'').startsWith('pay_')&&o[14]==='Paid';return `<tr data-id="${esc(v[0])}"><td><b>${esc(v[0])}</b><br><small>${esc(v[1])}<br>${esc(v[3])}</small></td><td>${esc(v[2])}<br><small>${inr(o[12])} · ${esc(o[13]||'')}<br>Order: ${esc(o[17]||'')} · Pay: ${esc(o[14]||'')}</small></td><td><b>${esc(v[4])}</b><br>${esc(v[5])}<br><small>${esc(v[6])}</small></td><td><select class="rst">${RS.map(s=>`<option${s===v[7]?' selected':''}>${s}</option>`).join('')}</select></td><td><input class="rnt" value="${esc(v[8])}" placeholder="Shown in their account"></td><td><button class="btn rs">Save</button> ${rf?`<button class="btn g" data-rf="${esc(v[2])}">Refund</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="6">No requests yet.</td></tr>'}</table></div>`}
function revs(){const nm=id=>(D.products.find(p=>p['product id']===id)||{})['product name']||id;
  $('#v').innerHTML=`<div class="box"><table><tr><th>Product</th><th>Reviewer</th><th>Rating</th><th>Review</th><th>Status</th><th></th></tr>${D.reviews.slice().reverse().map(r=>`<tr><td>${esc(nm(r.pid))}<br><small>${esc(r.pid)}</small></td><td>${esc(r.name)}<br><small>${r.verified==='Yes'?'Verified buyer':'Not a buyer'} · ${esc(r.date)}</small></td><td>${'★'.repeat(+r.rating||0)}</td><td>${esc(r.comment)}</td><td>${esc(r.status)}</td><td><button class="btn g" data-rh="${esc(r.id)}" data-to="${r.status==='Hidden'?'Approved':'Hidden'}">${r.status==='Hidden'?'Show':'Hide'}</button></td></tr>`).join('')||'<tr><td colspan="6">No reviews yet.</td></tr>'}</table></div>`}
function sellers(){
 const apps=D.requests.filter(x=>String(x.v[4]||'').toLowerCase()==='seller application').slice().reverse();
 $('#v').innerHTML=`<div class="box"><h2 style="margin-top:0">Seller applications</h2><p style="color:var(--mut)">Review applications from /sell-on-juno.html. Marking an application Approved records the review decision only; seller login, product publishing and payouts are not enabled by this first phase.</p><table><tr><th>Application</th><th>Store details</th><th>Products / profile</th><th>Review status</th><th>Admin note</th><th></th></tr>${apps.map(({v})=>{let d={};try{d=JSON.parse(v[6]||'{}')}catch(e){}return `<tr data-id="${esc(v[0])}"><td><b>${esc(v[5]||'Store')}</b><br><small>${esc(v[0])}<br>${esc(v[1])}<br>${esc(v[3])}</small></td><td>${esc(d.ownerName||'')}<br>${esc(d.phone||'')}<br>${esc(d.city||'')}<br><small>${esc(d.category||'')}</small></td><td>${d.social?`<a href="${esc(d.social)}" target="_blank" rel="noopener">Store / Instagram link</a><br>`:''}<small>${esc(d.about||'')}</small></td><td><select class="seller-status">${['Requested','Approved','Rejected','Closed'].map(s=>`<option${s===v[7]?' selected':''}>${s}</option>`).join('')}</select></td><td><input class="seller-note" value="${esc(v[8]||'')}" placeholder="Internal review note"></td><td><button class="btn seller-save">Save</button></td></tr>`}).join('')||'<tr><td colspan="6">No seller applications yet.</td></tr>'}</table></div>`;
 $('#v').querySelectorAll('.seller-save').forEach(btn=>btn.onclick=async()=>{const tr=btn.closest('tr');btn.disabled=true;try{await api({action:'updateRequest',id:tr.dataset.id,status:tr.querySelector('.seller-status').value,notes:tr.querySelector('.seller-note').value});toast('Application review saved');await load()}catch(e){toast(e.message)}finally{btn.disabled=false}});
}
function sellerproducts(){
 const list=D.products.filter(p=>String(p['seller id']||'').trim());
 $('#v').innerHTML=`<div class="box"><h2 style="margin-top:0">Seller-submitted products</h2><p style="color:var(--mut)">Approve a product to publish it on Juno. Rejected and pending seller listings remain hidden. Existing Juno-owned products are not shown here.</p><table><tr><th>Product</th><th>Seller ID</th><th>Category</th><th>Price / stock</th><th>Review</th><th>Actions</th></tr>${list.map(p=>`<tr data-id="${esc(p['product id'])}"><td><b>${esc(p['product name'])}</b><br><small>${esc(p['product id'])}</small><br><small>${esc(p.details||'')}</small></td><td>${esc(p['seller id'])}</td><td>${esc(p.category)}</td><td>${inr(p['selling price'])}<br>Stock: ${esc(p.stock)}</td><td><span class="pill">${esc(p['approval status']||'Pending')}</span></td><td><button class="btn seller-product-action" data-status="Approved">Approve</button> <button class="btn g seller-product-action" data-status="Rejected">Reject</button></td></tr>`).join('')||'<tr><td colspan="6">No seller-submitted products yet.</td></tr>'}</table></div>`;
 $('#v').querySelectorAll('.seller-product-action').forEach(btn=>btn.onclick=async()=>{const tr=btn.closest('tr');btn.disabled=true;try{await api({action:'setSellerProductStatus',id:tr.dataset.id,status:btn.dataset.status});toast('Product review saved');await load()}catch(e){toast(e.message)}finally{btn.disabled=false}});
}
function sellerorders(){
 const list=(D.sellerOrders||[]).slice().reverse();
 $('#v').innerHTML=`<div class="box"><h2 style="margin-top:0">Seller fulfilment orders</h2><p style="color:var(--mut)">These are fulfilment sub-orders created from paid customer orders. Payment splitting and seller payouts are not enabled; Juno's existing Razorpay checkout remains the payment flow.</p><table><tr><th>Seller order</th><th>Parent order</th><th>Seller</th><th>Customer / delivery</th><th>Items</th><th>Seller subtotal</th><th>Payment</th><th>Fulfilment</th><th>Tracking</th></tr>${list.map(({v})=>`<tr><td><b>${esc(v[0])}</b><br><small>${esc(v[2])}</small></td><td>${esc(v[1])}</td><td>${esc(v[4])}<br><small>${esc(v[3])}</small></td><td>${esc(v[5])}<br>${esc(v[7])}<br>${esc(v[8])}, ${esc(v[9])}<br><small>${esc(v[6])}</small></td><td><small>${esc(v[10])}</small><br>Qty: ${esc(v[11])}</td><td>${inr(v[12])}</td><td>${esc(v[15])}</td><td>${esc(v[16])}</td><td>${esc(v[17])}</td></tr>`).join('')||'<tr><td colspan="9">No seller fulfilment orders yet. Ensure the SellerOrders tab exists and orders include approved seller products.</td></tr>'}</table></div>`;
}
function tix(){const TS=['Open','In progress','Resolved','Closed'];
  $('#v').innerHTML=`<div class="box"><table><tr><th>Ticket</th><th>Customer</th><th>Message</th><th>Status</th><th>Reply to customer</th><th></th></tr>${D.tickets.slice().reverse().map(({v})=>`<tr data-id="${esc(v[0])}"><td><b>${esc(v[0])}</b><br><small>${esc(v[1])}<br>${esc(v[2])}</small></td><td>${esc(v[3])}<br><small>${esc(v[4])}<br>${esc(v[5])}${v[6]?'<br>Order '+esc(v[6]):''}</small></td><td>${esc(v[7])}</td><td><select class="tst">${TS.map(s=>`<option${s===v[8]?' selected':''}>${s}</option>`).join('')}</select></td><td><textarea class="trp" rows="3" placeholder="Written reply (emailed to the customer)">${esc(v[9])}</textarea></td><td><button class="btn ts">Save &amp; email</button></td></tr>`).join('')||'<tr><td colspan="6">No tickets yet.</td></tr>'}</table></div>`}
function users(){$('#v').innerHTML=`<div class="box"><table><tr><th>Name</th><th>Email</th><th>Joined</th><th>Last login</th><th>Logins</th></tr>${D.users.slice().reverse().map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.joined)}</td><td>${esc(u.last)}</td><td>${esc(u.count)}</td></tr>`).join('')||'<tr><td colspan="5">No customers yet.</td></tr>'}</table></div>`}
function edit(p){p=p||{};const g=k=>esc(p[k]==null?'':p[k]),cats=[...new Set(D.products.map(x=>x.category).filter(Boolean))],sel=(k,l)=>l.map(o=>`<option${String(p[k]||'').toLowerCase()===o.toLowerCase()?' selected':''}>${o}</option>`).join('');
  $('#pf').innerHTML=`<h2>${p.row?'Edit product':'Add product'}</h2><input type="hidden" id="f_id" value="${g('product id')}">
  <div class="f"><label>Product name</label><input id="f_name" value="${g('product name')}"></div>
  <div><label>Category (type a new one to create it)</label><input id="f_cat" list="cl" value="${g('category')}"><datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
  <div><label>For</label><select id="f_for">${sel('for',['Women','Men','Kids','Unisex'])}</select></div>
  <div><label>MRP (₹)</label><input id="f_mrp" inputmode="numeric" value="${g('mrp')}"></div><div><label>Selling price (₹)</label><input id="f_price" inputmode="numeric" value="${g('selling price')}"></div>
  <div><label>Details (e.g. Faux leather)</label><input id="f_det" value="${g('details')}"></div><div><label>Sizes/Colours (use | between)</label><input id="f_sz" placeholder="S|M|L, Pink|Black or iPhone 15" value="${g('sizes/colours')}"></div>
  <div class="f"><label>Image link (Cloudinary, Imgur, Google Drive share link) or a file name from /images</label><input id="f_img" value="${g('image')}"></div>
  <div><label>Stock</label><input id="f_stock" inputmode="numeric" value="${g('stock')}"></div><div><label>Rating</label><input id="f_rt" value="${g('rating')}" placeholder="4.3"></div>
  <div><label>Flash sale</label><select id="f_sale">${sel('flash sale',['No','Yes'])}</select></div><div><label>Show on site</label><select id="f_show">${sel('show on site',['Yes','No'])}</select></div>
  <div class="f row"><button class="btn" id="sp">Save</button><button class="btn g" id="cx">Cancel</button></div>`;$('#ov').classList.add('show');
  $('#cx').onclick=()=>$('#ov').classList.remove('show');
  $('#sp').onclick=async()=>{try{await api({action:'saveProduct',product:{id:$('#f_id').value,name:$('#f_name').value,cat:$('#f_cat').value,g:$('#f_for').value,mrp:$('#f_mrp').value,price:$('#f_price').value,details:$('#f_det').value,sizes:$('#f_sz').value,image:$('#f_img').value,stock:$('#f_stock').value,rating:$('#f_rt').value,sale:$('#f_sale').value,show:$('#f_show').value}});$('#ov').classList.remove('show');toast('Saved');load()}catch(e){toast(e.message)}}}
if(tok)load();
</script></body></html>
